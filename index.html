<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bally's Live Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #fff; font-family: Arial, sans-serif; padding: 20px; }
    header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #cc0000; padding-bottom: 15px; margin-bottom: 25px; }
    header .logo-area { display: flex; align-items: center; gap: 15px; }
    header img { height: 50px; }
    header h1 { font-size: 2rem; color: #cc0000; letter-spacing: 2px; }
    #last-updated { font-size: 0.85rem; color: #aaa; }
    .section-title { font-size: 1rem; font-weight: bold; color: #cc0000; letter-spacing: 2px; border-left: 4px solid #cc0000; padding-left: 10px; margin-bottom: 15px; }
    /* STOCK */
    #stock-section { margin-bottom: 30px; }
    .stock-card { background: #1a1a1a; border: 1px solid #333; border-radius: 10px; padding: 18px 25px; display: flex; align-items: center; gap: 30px; }
    .stock-symbol { font-size: 1.4rem; font-weight: bold; color: #fff; }
    .stock-price { font-size: 1.4rem; font-weight: bold; color: #fff; }
    .stock-change.positive { color: #00cc44; font-size: 1.2rem; font-weight: bold; }
    .stock-change.negative { color: #cc0000; font-size: 1.2rem; font-weight: bold; }
    .stock-time { margin-left: auto; color: #888; font-size: 0.8rem; }
    /* WEATHER GRID - 3 columns */
    #weather-section { margin-bottom: 30px; }
    .weather-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
    .weather-card { background: #1a1a1a; border: 1px solid #333; border-radius: 10px; padding: 18px; }
    .weather-card .city { font-size: 0.85rem; font-weight: bold; color: #cc0000; letter-spacing: 1px; margin-bottom: 8px; }
    .weather-card .temp { font-size: 2.2rem; font-weight: bold; color: #fff; }
    .weather-card .desc { font-size: 0.9rem; color: #aaa; margin-left: 10px; }
    .weather-card .details { margin-top: 8px; font-size: 0.8rem; color: #888; }
    /* FORECAST GRID - 3 columns */
    #forecast-section { margin-bottom: 30px; }
    .forecast-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
    .forecast-card { background: #1a1a1a; border: 1px solid #333; border-radius: 10px; padding: 18px; }
    .forecast-card .city { font-size: 0.85rem; font-weight: bold; color: #cc0000; letter-spacing: 1px; margin-bottom: 10px; }
    .forecast-days { display: flex; flex-direction: column; gap: 6px; }
    .forecast-day { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; border-bottom: 1px solid #2a2a2a; padding-bottom: 4px; }
    .forecast-day .day-name { color: #aaa; width: 60px; }
    .forecast-day .day-desc { color: #ccc; flex: 1; text-align: center; }
    .forecast-day .day-temps { color: #fff; font-weight: bold; }
    .forecast-day .day-precip { color: #4499ff; margin-left: 8px; }
  </style>
</head>
<body>

<header>
  <div class="logo-area">
    <img src="BALY.png" alt="Bally's Logo" onerror="this.style.display='none'" />
    <h1>BALLY'S LIVE DASHBOARD</h1>
  </div>
  <div id="last-updated">Loading...</div>
</header>

<!-- STOCK -->
<div id="stock-section">
  <div class="section-title">STOCK</div>
  <div class="stock-card">
    <div class="stock-symbol" id="stock-symbol">--</div>
    <div class="stock-price" id="stock-price">--</div>
    <div class="stock-change" id="stock-change">--</div>
    <div class="stock-time" id="stock-time"></div>
  </div>
</div>

<!-- CURRENT WEATHER -->
<div id="weather-section">
  <div class="section-title">CURRENT WEATHER</div>
  <div class="weather-grid" id="weather-grid">Loading...</div>
</div>

<!-- 5-DAY FORECAST -->
<div id="forecast-section">
  <div class="section-title">5-DAY FORECAST</div>
  <div class="forecast-grid" id="forecast-grid">Loading...</div>
</div>

<script>
  // ---- CONFIG ----
  const SHEET_ID = "1k0_MNr7TfbAFABEaOCmu4hnAXBPCdxvQJ9mq5F3nzn8";
  const WEATHER_TAB = "Weather";
  const FORECAST_TAB = "Forecast";
  const STOCK_TAB = "Stocks";
  const API_KEY = "AIzaSyBuDdGnUWX9h-GxY5oFbk5qEi3cHGqZ4TI";

  // City name mapping - API name -> Display name
  const CITY_NAME_MAP = {
    "Zephyr Cove-Round Hill Village": "Stateline",
    "Zephyr Cove": "Stateline",
    "Round Hill Village": "Stateline",
    "Kingsbury": "Stateline",
    "Central City": "Black Hawk",
    "Henderson": "Henderson",
    "Reno": "Reno",
    "Denver": "Denver",
    "Providence": "Providence"
  };

  function mapCityName(name) {
    if (!name) return name;
    // Check direct match
    if (CITY_NAME_MAP[name]) return CITY_NAME_MAP[name];
    // Check if any key is contained in the name
    for (const [key, val] of Object.entries(CITY_NAME_MAP)) {
      if (name.toLowerCase().includes(key.toLowerCase())) return val;
    }
    return name;
  }

  function roundTemp(t) {
    const num = parseFloat(t);
    return isNaN(num) ? t : Math.round(num);
  }

  function capitalize(str) {
    if (!str) return str;
    return str.split(" ").map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(" ");
  }

  async function fetchSheet(tabName) {
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(tabName)}?key=${API_KEY}`;
    const resp = await fetch(url, { cache: "no-store" });
    const data = await resp.json();
    if (!data.values || data.values.length < 2) return [];
    const headers = data.values[0].map(h => h.trim());
    return data.values.slice(1).map(row => {
      const obj = {};
      headers.forEach((h, i) => obj[h] = row[i] || "");
      return obj;
    });
  }

  function getLastPerCity(rows, cityCol) {
    const map = {};
    for (const row of rows) {
      const city = row[cityCol] || "";
      map[city] = row; // keeps overwriting so last one wins
    }
    return Object.values(map);
  }

  function getLastForecastPerCityDay(rows) {
    const map = {};
    for (const row of rows) {
      const city = row["city"] || row["City"] || "";
      const date = row["date"] || row["Date"] || row["forecastDate"] || "";
      const key = city + "__" + date;
      map[key] = row;
    }
    return Object.values(map);
  }

  async function loadStock() {
    try {
      const rows = await fetchSheet(STOCK_TAB);
      if (!rows.length) return;
      const row = rows[rows.length - 1];

      const symbol = row["symbol"] || row["Symbol"] || "BALY";
      const price = row["currentPrice"] || row["CurrentPrice"] || row["price"] || "--";
      const change = row["percentChange"] || row["PercentChange"] || row["change"] || "--";
      const ts = row["timestamp"] || row["Timestamp"] || "";

      document.getElementById("stock-symbol").textContent = symbol;
      document.getElementById("stock-price").textContent = price.startsWith("$") ? price : "$" + price;

      const changeEl = document.getElementById("stock-change");
      changeEl.textContent = change;
      const changeNum = parseFloat(change.replace("%", "").replace("+", ""));
      changeEl.className = "stock-change " + (changeNum >= 0 ? "positive" : "negative");

      if (ts) document.getElementById("stock-time").textContent = "As of " + ts;
    } catch(e) {
      console.error("Stock error:", e);
    }
  }

  async function loadWeather() {
    try {
      const rows = await fetchSheet(WEATHER_TAB);
      if (!rows.length) return;

      // Find city column name
      const cityCol = Object.keys(rows[0]).find(k => k.toLowerCase() === "city") || "city";
      const latest = getLastPerCity(rows, cityCol);

      const grid = document.getElementById("weather-grid");
      grid.innerHTML = "";

      for (const row of latest) {
        const rawCity = row[cityCol] || row["City"] || "Unknown";
        const city = mapCityName(rawCity);
        const temp = roundTemp(row["temperature"] || row["Temperature"] || row["temp"] || row["currentTemp"] || "");
        const desc = capitalize(row["description"] || row["Description"] || row["conditions"] || row["weather"] || "");
        const humidity = row["humidity"] || row["Humidity"] || "";
        const wind = row["windSpeed"] || row["WindSpeed"] || row["wind"] || "";

        const card = document.createElement("div");
        card.className = "weather-card";
        card.innerHTML = `
          <div class="city">${city.toUpperCase()}</div>
          <div style="display:flex;align-items:baseline">
            <div class="temp">${temp !== "" ? temp + "°" : "--"}</div>
            <div class="desc">${desc || "--"}</div>
          </div>
          <div class="details">
            ${humidity ? "Humidity: " + humidity + "% &nbsp;" : ""}
            ${wind ? "Wind: " + wind + " mph" : ""}
          </div>
        `;
        grid.appendChild(card);
      }
    } catch(e) {
      console.error("Weather error:", e);
    }
  }

  async function loadForecast() {
    try {
      const rows = await fetchSheet(FORECAST_TAB);
      if (!rows.length) return;

      const latestRows = getLastForecastPerCityDay(rows);

      // Group by city
      const cityMap = {};
      for (const row of latestRows) {
        const rawCity = row["city"] || row["City"] || "Unknown";
        const city = mapCityName(rawCity);
        if (!cityMap[city]) cityMap[city] = [];
        cityMap[city].push(row);
      }

      const grid = document.getElementById("forecast-grid");
      grid.innerHTML = "";

      for (const [city, days] of Object.entries(cityMap)) {
        // Sort by date
        days.sort((a, b) => {
          const da = new Date(a["date"] || a["Date"] || a["forecastDate"] || 0);
          const db = new Date(b["date"] || b["Date"] || b["forecastDate"] || 0);
          return da - db;
        });

        const card = document.createElement("div");
        card.className = "forecast-card";

        let daysHTML = "";
        for (const day of days.slice(0, 5)) {
          const dateStr = day["date"] || day["Date"] || day["forecastDate"] || "";
          const dayName = dateStr ? new Date(dateStr + "T12:00:00").toLocaleDateString("en-US", { weekday: "short" }) : "--";
          const high = roundTemp(day["highTemp"] || day["high"] || day["High"] || day["maxTemp"] || "");
          const low = roundTemp(day["lowTemp"] || day["low"] || day["Low"] || day["minTemp"] || "");
          const desc = capitalize(day["description"] || day["Description"] || day["conditions"] || "");
          const precip = day["precipitationChance"] || day["precip"] || day["Precip"] || day["pop"] || "";

          daysHTML += `
            <div class="forecast-day">
              <div class="day-name">${dayName}</div>
              <div class="day-desc">${desc || "--"}</div>
              <div class="day-temps">${high !== "" ? high + "°" : "--"}/${low !== "" ? low + "°" : "--"}</div>
              ${precip ? `<div class="day-precip">${precip}%</div>` : ""}
            </div>
          `;
        }

        card.innerHTML = `
          <div class="city">${city.toUpperCase()}</div>
          <div class="forecast-days">${daysHTML}</div>
        `;
        grid.appendChild(card);
      }
    } catch(e) {
      console.error("Forecast error:", e);
    }
  }

  function updateTime() {
    document.getElementById("last-updated").textContent = "Last updated: " + new Date().toLocaleTimeString();
  }

  async function loadAll() {
    await Promise.all([loadStock(), loadWeather(), loadForecast()]);
    updateTime();
  }

  loadAll();
  setInterval(loadAll, 5 * 60 * 1000);
</script>

</body>
</html>
