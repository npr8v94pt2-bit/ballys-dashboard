<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bally's Weather Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 20px;
      min-height: 100vh;
    }
    .dashboard {
      max-width: 1200px;
      margin: 0 auto;
    }
    .row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 15px;
    }
    .card {
      background: #111;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 15px;
      min-height: 220px;
    }
    .logo-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid #ff0000;
    }
    .logo-card img {
      width: 120px;
      height: auto;
    }
    .stock-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid #ff0000;
    }
    .stock-symbol {
      font-size: 1.4em;
      font-weight: bold;
      color: #ff0000;
      margin-bottom: 8px;
    }
    .stock-price {
      font-size: 2em;
      font-weight: bold;
      color: #fff;
      margin-bottom: 8px;
    }
    .stock-change {
      font-size: 1.2em;
      font-weight: bold;
    }
    .stock-change.positive { color: #00ff00; }
    .stock-change.negative { color: #ff0000; }
    .city-card .city-name {
      font-size: 1.1em;
      font-weight: bold;
      color: #ff0000;
      text-align: center;
      margin-bottom: 10px;
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
    }
    .current-weather {
      text-align: center;
      margin-bottom: 10px;
    }
    .temp-big {
      font-size: 2em;
      font-weight: bold;
      color: #fff;
    }
    .conditions {
      font-size: 0.85em;
      color: #aaa;
      text-transform: capitalize;
      margin: 3px 0;
    }
    .wind {
      font-size: 0.8em;
      color: #888;
    }
    .forecast {
      border-top: 1px solid #333;
      padding-top: 8px;
      margin-top: 5px;
    }
    .forecast-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 3px 0;
      font-size: 0.75em;
      border-bottom: 1px solid #1a1a1a;
    }
    .forecast-row:last-child { border-bottom: none; }
    .forecast-day { color: #aaa; width: 30px; }
    .forecast-temps { color: #fff; }
    .forecast-high { color: #ff6b6b; }
    .forecast-low { color: #6bb5ff; }
    .forecast-desc { color: #888; font-size: 0.9em; text-align: right; flex: 1; margin-left: 5px; text-transform: capitalize; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .forecast-precip { color: #6bb5ff; width: 30px; text-align: right; }
    .last-updated {
      text-align: center;
      color: #555;
      font-size: 0.75em;
      margin-top: 15px;
    }
    .loading { color: #555; text-align: center; font-size: 0.85em; }
  </style>
</head>
<body>
  <div class="dashboard">
    <div class="row" id="row1">
      <div class="card logo-card">
        <img src="BALY.png" alt="Ballys Logo">
      </div>
      <div class="card city-card" id="city-Henderson"><div class="loading">Loading...</div></div>
      <div class="card city-card" id="city-Reno"><div class="loading">Loading...</div></div>
      <div class="card city-card" id="city-Stateline"><div class="loading">Loading...</div></div>
    </div>
    <div class="row" id="row2">
      <div class="card stock-card" id="stock-card">
        <div class="stock-symbol">BALY</div>
        <div class="stock-price" id="stock-price">--</div>
        <div class="stock-change" id="stock-change">--</div>
      </div>
      <div class="card city-card" id="city-Denver"><div class="loading">Loading...</div></div>
      <div class="card city-card" id="city-Black Hawk"><div class="loading">Loading...</div></div>
      <div class="card city-card" id="city-Providence"><div class="loading">Loading...</div></div>
    </div>
    <div class="last-updated" id="last-updated">Loading data...</div>
  </div>

  <script>
    const SHEET_ID = "1foje84iHozCcRp0uhcoVX2T__nhjUumNFNUFxBf55Qs";
    const WEATHER_GID = "1766022830";
    const FORECAST_GID = "653223377";
    const STOCKS_GID = "1819125637";

    const CITIES = ["Henderson", "Reno", "Stateline", "Denver", "Black Hawk", "Providence"];
    const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

    function getDayName(offset) {
      const d = new Date();
      d.setDate(d.getDate() + offset);
      return DAYS[d.getDay()];
    }

    function fetchCSV(gid) {
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${gid}`;
      return fetch(url).then(r => r.text()).then(text => {
        const lines = text.trim().split("\n");
        const headers = lines[0].split(",").map(h => h.trim().replace(/^"|"$/g, ""));
        return lines.slice(1).map(line => {
          const vals = [];
          let inQuote = false, cur = "";
          for (let c of line) {
            if (c === '"' ) { inQuote = !inQuote; }
            else if (c === "," && !inQuote) { vals.push(cur.trim()); cur = ""; }
            else { cur += c; }
          }
          vals.push(cur.trim());
          const obj = {};
          headers.forEach((h, i) => obj[h] = vals[i] || "");
          return obj;
        });
      });
    }

    function buildCityCard(cityName, weatherRow, forecastRow) {
      const el = document.getElementById(`city-${cityName}`);
      if (!el) return;

      const temp = weatherRow ? Math.round(parseFloat(weatherRow.Temp)) : "--";
      const conditions = weatherRow ? weatherRow.Conditions : "--";
      const wind = weatherRow ? Math.round(parseFloat(weatherRow["Wind Speed"])) : "--";

      let forecastHTML = "";
      if (forecastRow) {
        for (let d = 1; d <= 5; d++) {
          const high = Math.round(parseFloat(forecastRow[`Day${d} High`]));
          const low = Math.round(parseFloat(forecastRow[`Day${d} Low`]));
          const desc = forecastRow[`Day${d} Conditions`] || "";
          const precip = Math.round(parseFloat(forecastRow[`Day${d} Precip`] || 0) * 100);
          forecastHTML += `
            <div class="forecast-row">
              <span class="forecast-day">${getDayName(d)}</span>
              <span class="forecast-temps"><span class="forecast-high">${high}°</span> / <span class="forecast-low">${low}°</span></span>
              <span class="forecast-desc">${desc}</span>
              <span class="forecast-precip">${precip}%</span>
            </div>`;
        }
      }

      el.innerHTML = `
        <div class="city-name">${cityName}</div>
        <div class="current-weather">
          <div class="temp-big">${temp}°F</div>
          <div class="conditions">${conditions}</div>
          <div class="wind">💨 ${wind} mph</div>
        </div>
        <div class="forecast">${forecastHTML}</div>`;
    }

    function updateStock(stockRows) {
      // Get latest BALY row
      const baly = stockRows.filter(r => r.symbol && r.symbol.toUpperCase() === "BALY").pop();
      if (!baly) return;

      const priceEl = document.getElementById("stock-price");
      const changeEl = document.getElementById("stock-change");

      let price = baly.currentPrice || baly.Price || baly.price || "";
      let change = baly.percentChange || baly.PercentChange || baly["Change Percent"] || baly.changePercent || "";

      priceEl.textContent = price || "--";

      if (change) {
        const isNeg = change.includes("-");
        changeEl.textContent = (isNeg ? "" : "+") + change;
        changeEl.className = "stock-change " + (isNeg ? "negative" : "positive");
      } else {
        changeEl.textContent = "--";
      }
    }

    async function loadData() {
      try {
        const [weatherRows, forecastRows, stockRows] = await Promise.all([
          fetchCSV(WEATHER_GID),
          fetchCSV(FORECAST_GID),
          fetchCSV(STOCKS_GID)
        ]);

        // Get latest row per city for weather
        const latestWeather = {};
        weatherRows.forEach(r => { if (r.City) latestWeather[r.City] = r; });

        // Get latest row per city for forecast
        const latestForecast = {};
        forecastRows.forEach(r => { if (r.City) latestForecast[r.City] = r; });

        CITIES.forEach(city => {
          buildCityCard(city, latestWeather[city], latestForecast[city]);
        });

        updateStock(stockRows);

        document.getElementById("last-updated").textContent =
          "Last updated: " + new Date().toLocaleString();

      } catch(e) {
        document.getElementById("last-updated").textContent = "Error loading data: " + e.message;
        console.error(e);
      }
    }

    loadData();
    setInterval(loadData, 300000); // refresh every 5 minutes
  </script>
</body>
</html>
