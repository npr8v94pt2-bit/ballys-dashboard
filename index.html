<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #1a1a2e;
      color: #eee;
      padding: 20px;
    }
    h1 {
      text-align: center;
      font-size: 2em;
      margin-bottom: 20px;
      color: #fff;
      letter-spacing: 2px;
    }
    h2 {
      font-size: 1.1em;
      margin-bottom: 12px;
      color: #aad4f5;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid #2a2a4a;
      padding-bottom: 6px;
    }
    .section { margin-bottom: 30px; }

    /* WEATHER */
    .weather-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    .weather-card {
      background: #16213e;
      border-radius: 10px;
      padding: 16px;
      text-align: center;
      border: 1px solid #2a2a5a;
    }
    .weather-card .city { font-size: 1em; font-weight: bold; color: #aad4f5; margin-bottom: 6px; }
    .weather-card .temp { font-size: 2em; font-weight: bold; color: #fff; }
    .weather-card .conditions { font-size: 0.85em; color: #ccc; margin-top: 4px; text-transform: capitalize; }
    .weather-card .wind { font-size: 0.8em; color: #999; margin-top: 4px; }

    /* STOCKS */
    .stocks-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    .stock-card {
      background: #16213e;
      border-radius: 10px;
      padding: 16px;
      text-align: center;
      border: 1px solid #2a2a5a;
    }
    .stock-card .symbol { font-size: 1.1em; font-weight: bold; color: #aad4f5; margin-bottom: 6px; }
    .stock-card .price { font-size: 1.8em; font-weight: bold; color: #fff; }
    .stock-card .change { font-size: 0.95em; margin-top: 4px; font-weight: bold; }
    .change.positive { color: #4caf50; }
    .change.negative { color: #f44336; }

    /* FORECAST */
    .forecast-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    .forecast-card {
      background: #16213e;
      border-radius: 10px;
      padding: 16px;
      border: 1px solid #2a2a5a;
    }
    .forecast-card .city { font-size: 1em; font-weight: bold; color: #aad4f5; margin-bottom: 10px; text-align: center; }
    .forecast-day {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
      border-bottom: 1px solid #2a2a4a;
      font-size: 0.82em;
    }
    .forecast-day:last-child { border-bottom: none; }
    .forecast-day .day-label { color: #aad4f5; font-weight: bold; min-width: 40px; }
    .forecast-day .day-temps { color: #fff; }
    .forecast-day .day-cond { color: #ccc; text-transform: capitalize; text-align: right; flex: 1; margin: 0 6px; }
    .forecast-day .day-precip { color: #7ec8e3; min-width: 30px; text-align: right; }

    .loading { color: #666; font-style: italic; text-align: center; padding: 20px; }
    .timestamp { text-align: center; color: #555; font-size: 0.75em; margin-top: 20px; }
  </style>
</head>
<body>

<h1>&#127944; Tahoe DOR Dashboard</h1>

<!-- WEATHER SECTION -->
<div class="section">
  <h2>&#127783; Current Weather</h2>
  <div class="weather-grid" id="weather-grid">
    <div class="loading">Loading weather...</div>
  </div>
</div>

<!-- STOCKS SECTION -->
<div class="section">
  <h2>&#128200; Stocks</h2>
  <div class="stocks-grid" id="stocks-grid">
    <div class="loading">Loading stocks...</div>
  </div>
</div>

<!-- FORECAST SECTION -->
<div class="section">
  <h2>&#128197; 5-Day Forecast</h2>
  <div class="forecast-grid" id="forecast-grid">
    <div class="loading">Loading forecast...</div>
  </div>
</div>

<div class="timestamp" id="timestamp"></div>

<script>
  const SHEET_ID = "1foje84iHozCcRp0uhcoVX2T__nhjUumNFNUFxBf55Qs";
  const API_KEY = "AIzaSyD5JqGOW_HmEVBEHkxVTB_p7l99Jj8jP0c";

  const WEATHER_CITY_MAP = {
    "Zephyr Cove-Round Hill Village": "Stateline",
    "Zephyr Cove": "Stateline",
    "Central City": "Black Hawk"
  };

  function mapCityName(name) {
    return WEATHER_CITY_MAP[name] || name;
  }

  async function fetchSheet(sheetName) {
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(sheetName)}?key=${API_KEY}`;
    const res = await fetch(url);
    const data = await res.json();
    if (!data.values || data.values.length < 2) return [];
    const headers = data.values[0];
    return data.values.slice(1).map(row => {
      const obj = {};
      headers.forEach((h, i) => obj[h] = row[i] || "");
      return obj;
    });
  }

  function getLatest(rows, keyField) {
    const latest = {};
    rows.forEach(row => {
      const key = row[keyField];
      if (key) latest[key] = row;
    });
    return Object.values(latest);
  }

  async function loadWeather() {
    const rows = await fetchSheet("Weather");
    const latest = getLatest(rows, "City");
    const grid = document.getElementById("weather-grid");
    if (!latest.length) { grid.innerHTML = "<div class='loading'>No data</div>"; return; }
    grid.innerHTML = latest.map(r => {
      const city = mapCityName(r["City"]);
      const temp = Math.round(parseFloat(r["Temp"]));
      const cond = r["Conditions"] || "";
      const wind = r["Wind Speed"] ? Math.round(parseFloat(r["Wind Speed"])) + " mph" : "";
      return `<div class="weather-card">
        <div class="city">${city}</div>
        <div class="temp">${temp}&deg;F</div>
        <div class="conditions">${cond}</div>
        <div class="wind">${wind}</div>
      </div>`;
    }).join("");
  }

  async function loadStocks() {
    const rows = await fetchSheet("Stocks");
    const latest = getLatest(rows, "symbol");
    const grid = document.getElementById("stocks-grid");
    if (!latest.length) { grid.innerHTML = "<div class='loading'>No data</div>"; return; }
    grid.innerHTML = latest.map(r => {
      const symbol = r["symbol"] || "";
      const price = parseFloat(r["currentPrice"]).toFixed(2);
      const change = parseFloat(r["percentChange"]);
      const changeStr = (change >= 0 ? "+" : "") + change.toFixed(2) + "%";
      const cls = change >= 0 ? "positive" : "negative";
      return `<div class="stock-card">
        <div class="symbol">${symbol}</div>
        <div class="price">$${price}</div>
        <div class="change ${cls}">${changeStr}</div>
      </div>`;
    }).join("");
  }

  async function loadForecast() {
    const rows = await fetchSheet("Forecast");
    const latest = getLatest(rows, "City");
    const grid = document.getElementById("forecast-grid");
    if (!latest.length) { grid.innerHTML = "<div class='loading'>No data</div>"; return; }
    grid.innerHTML = latest.map(r => {
      const city = r["City"] || "";
      let daysHtml = "";
      for (let d = 1; d <= 5; d++) {
        const high = r[`Day ${d} High`] ? Math.round(parseFloat(r[`Day ${d} High`])) + "°" : "--";
        const low  = r[`Day ${d} Low`]  ? Math.round(parseFloat(r[`Day ${d} Low`]))  + "°" : "--";
        const cond = r[`Day ${d} Conditions`] || "--";
        const prec = r[`Day ${d} Precip`] !== undefined && r[`Day ${d} Precip`] !== "" 
                     ? Math.round(parseFloat(r[`Day ${d} Precip`])) + "mm" : "--";
        daysHtml += `<div class="forecast-day">
          <span class="day-label">Day ${d}</span>
          <span class="day-temps">${high}/${low}</span>
          <span class="day-cond">${cond}</span>
          <span class="day-precip">${prec}</span>
        </div>`;
      }
      return `<div class="forecast-card">
        <div class="city">${city}</div>
        ${daysHtml}
      </div>`;
    }).join("");
  }

  async function loadAll() {
    await Promise.all([loadWeather(), loadStocks(), loadForecast()]);
    document.getElementById("timestamp").textContent = "Last updated: " + new Date().toLocaleString();
  }

  loadAll();
  setInterval(loadAll, 60000);
</script>

</body>
</html>
