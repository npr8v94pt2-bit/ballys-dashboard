```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bally's Tahoe DOR Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #000000;
      color: #eee;
      padding: 20px;

    .dashboard {
      display: grid;
      grid-template-columns: 220px 1fr;

    .left-col {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .logo-box {
      background: #111;
      border: 2px solid #cc0000;
      border-radius: 16px;
      padding: 20px;
      display: flex;

      width: 100%;

      background: #111;

    .city-card .temp {
      font-size: 2.4em;

      color: #fff;

      font-size: 0.85em;

<body>

<div class="dashboard">

  <!-- LEFT COLUMN -->
  <div class="left-col">
    <div class="logo-box">
      <img src="https://raw.githubusercontent.com/npr8v94pt2-bit/ballys-dashboard/main/BALY.png" alt="Bally's Logo">
    </div>
    <div class="stock-box" id="stock-box">
      <div class="loading">Loading...</div>
    </div>
  </div>

  <!-- RIGHT COLUMN - 6 CITY CARDS -->
  <div class="right-col" id="city-grid">
    <div class="loading">Loading weather...</div>
  </div>

</div>

<div class="timestamp" id="timestamp"></div>

<script>
  const SHEET_ID = "1foje84iHozCcRp0uhcoVX2T__nhjUumNFNUFxBf55Qs";
  const API_KEY = "AIzaSyD5JqGOW_HmEVBEHkxVTB_p7l99Jj8jP0c";

  const CITY_ORDER = ["Stateline", "Denver", "Black Hawk", "Henderson", "Reno", "Providence"];

  const WEATHER_CITY_MAP = {
    "Zephyr Cove-Round Hill Village": "Stateline",
    "Zephyr Cove": "Stateline",
    "Central City": "Black Hawk"
  };

  function mapCityName(name) {
    return WEATHER_CITY_MAP[name] || name;
  }

  async function fetchSheet(sheetName) {
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(sheetName)}?key=${API_KEY}`;
    const res = await fetch(url);
    const data = await res.json();
    if (!data.values || data.values.length < 2) return [];
    const headers = data.values[0];
    return data.values.slice(1).map(row => {
      const obj = {};
      headers.forEach((h, i) => obj[h] = row[i] || "");
      return obj;
    });
  }

  function getLatest(rows, keyField) {
    const map = {};
    rows.forEach(r => {
      const key = r[keyField];
      if (key) map[key] = r;
    });
    return map;
  }

  async function loadAll() {
    const [weatherRows, forecastRows, stockRows] = await Promise.all([
      fetchSheet("Weather"),
      fetchSheet("Forecast"),
      fetchSheet("Stocks")
    ]);

    const weatherMap = getLatest(weatherRows, "City");
    const forecastMap = getLatest(forecastRows, "City");

    // Remap city names
    const remappedWeather = {};
    Object.keys(weatherMap).forEach(k => {
      remappedWeather[mapCityName(k)] = weatherMap[k];
    });

    const remappedForecast = {};
    Object.keys(forecastMap).forEach(k => {
      remappedForecast[mapCityName(k)] = forecastMap[k];
    });

    // BUILD CITY CARDS
    const grid = document.getElementById("city-grid");
    grid.innerHTML = CITY_ORDER.map(city => {
      const w = remappedWeather[city] || {};
      const f = remappedForecast[city] || {};

      const temp = w["Temp"] ? Math.round(parseFloat(w["Temp"])) + "°F" : "--";
      const cond = w["Conditions"] || "--";
      const wind = w["Wind Speed"] ? Math.round(parseFloat(w["Wind Speed"])) + " mph" : "--";

      let forecastHtml = "";
      for (let d = 1; d <= 5; d++) {
        const high = f[`Day${d} High`] ? Math.round(parseFloat(f[`Day${d} High`])) + "°" : "--";
        const low  = f[`Day${d} Low`]  ? Math.round(parseFloat(f[`Day${d} Low`]))  + "°" : "--";
        const dc   = f[`Day${d} Conditions`] || "--";
        const prec = f[`Day${d} Precip`] !== undefined && f[`Day${d} Precip`] !== ""
                     ? Math.round(parseFloat(f[`Day${d} Precip`])) + "mm" : "--";
        forecastHtml += `<div class="forecast-day">
          <span class="day-label">D${d}</span>
          <span class="day-temps">${high}/${low}</span>
          <span class="day-cond">${dc}</span>
          <span class="day-precip">${prec}</span>
        </div>`;
      }

      return `<div class="city-card">
        <div class="city-name">${city}</div>
        <div class="temp">${temp}</div>
        <div class="conditions">${cond}</div>
        <div class="wind">💨 ${wind}</div>
        <div class="forecast-divider"></div>
        ${forecastHtml}
      </div>`;
    }).join("");

    // BUILD STOCK BOX
    const stockBox = document.getElementById("stock-box");
    const stockMap = getLatest(stockRows, "symbol");
    const stock = Object.values(stockMap)[0];
    if (stock) {
      const symbol = stock["symbol"] || "";
      const price = parseFloat(stock["currentPrice"]).toFixed(2);
      const change = parseFloat(stock["percentChange"]);
      const changeStr = (change >= 0 ? "+" : "") + change.toFixed(2) + "%";
      const cls = change >= 0 ? "positive" : "negative";
      stockBox.innerHTML = `
        <div class="symbol">${symbol}</div>
        <div class="price">$${price}</div>
        <div class="change ${cls}">${changeStr}</div>
      `;
    } else {
      stockBox.innerHTML = "<div class='loading'>No data</div>";
    }

    document.getElementById("timestamp").textContent = "Last updated: " + new Date().toLocaleString();
  }

  loadAll();
  setInterval(loadAll, 60000);
</script>

</body>
</html>
