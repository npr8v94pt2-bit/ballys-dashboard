<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bally's Live Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 0;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      border-bottom: 2px solid #cc0000;
      background: #000;
    }
    .logo-area {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .logo-area img {
      height: 48px;
    }
    .logo-area h1 {
      color: #cc0000;
      font-size: 1.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    #last-updated {
      color: #aaa;
      font-size: 0.85rem;
    }
    main {
      padding: 20px 24px;
    }
    .section-title {
      color: #cc0000;
      font-size: 1rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
      border-left: 4px solid #cc0000;
      padding-left: 10px;
      margin-bottom: 14px;
      margin-top: 24px;
    }
    /* STOCK */
    .stock-bar {
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .stock-left {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .stock-symbol {
      font-size: 1.4rem;
      font-weight: bold;
      color: #fff;
    }
    .stock-price {
      font-size: 1.4rem;
      font-weight: bold;
      color: #fff;
    }
    .stock-change.positive { color: #00cc44; font-size: 1.1rem; font-weight: bold; }
    .stock-change.negative { color: #cc0000; font-size: 1.1rem; font-weight: bold; }
    .stock-time { color: #888; font-size: 0.8rem; }
    /* WEATHER GRID */
    .weather-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    .weather-card {
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 16px;
    }
    .weather-card .city-name {
      color: #cc0000;
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .weather-card .temp {
      font-size: 2.2rem;
      font-weight: bold;
      color: #fff;
    }
    .weather-card .temp span {
      font-size: 1rem;
      color: #aaa;
      margin-left: 8px;
    }
    .weather-card .condition {
      color: #aaa;
      font-size: 0.85rem;
      margin-top: 4px;
      text-transform: capitalize;
    }
    /* FORECAST GRID */
    .forecast-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    .forecast-card {
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 14px;
    }
    .forecast-card .city-name {
      color: #cc0000;
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }
    .forecast-day {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      border-bottom: 1px solid #222;
      font-size: 0.82rem;
    }
    .forecast-day:last-child { border-bottom: none; }
    .forecast-day .day-label { color: #aaa; width: 30px; }
    .forecast-day .day-condition { color: #ccc; flex: 1; text-align: center; text-transform: capitalize; }
    .forecast-day .day-temps { color: #fff; font-weight: bold; white-space: nowrap; }
    .forecast-day .day-rain { color: #4a9eff; font-size: 0.75rem; margin-left: 6px; }
  </style>
</head>
<body>

<header>
  <div class="logo-area">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/47/Bally%27s_logo.svg/320px-Bally%27s_logo.svg.png" alt="Bally's Logo" />
    <h1>Live Dashboard</h1>
  </div>
  <div id="last-updated">Loading...</div>
</header>

<main>
  <div class="section-title">Stock</div>
  <div class="stock-bar">
    <div class="stock-left">
      <div class="stock-symbol" id="stock-symbol">-</div>
      <div class="stock-price" id="stock-price">-</div>
      <div class="stock-change" id="stock-change">-</div>
    </div>
    <div class="stock-time" id="stock-time"></div>
  </div>

  <div class="section-title">Current Weather</div>
  <div class="weather-grid" id="weather-grid"></div>

  <div class="section-title">5-Day Forecast</div>
  <div class="forecast-grid" id="forecast-grid"></div>
</main>

<script>
  const SHEET_ID = "1foje84iHozCcRp0uhcoVX2T__nhjUumNFNUFxBf55Qs";
  const API_KEY  = "AIzaSyA3HMhNVdOKKpKb3aRW2YBZFB1bQbEREJM";

  const CITY_NAME_MAP = {
    "zephyr cove-round hill village": "Stateline",
    "kingsbury": "Stateline",
    "central city": "Black Hawk",
    "black hawk": "Black Hawk"
  };

  function mapCityName(name) {
    if (!name) return name;
    return CITY_NAME_MAP[name.toLowerCase().trim()] || name;
  }

  function sheetUrl(sheetName) {
    return `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(sheetName)}?key=${API_KEY}`;
  }

  async function fetchSheet(sheetName) {
    const res = await fetch(sheetUrl(sheetName), { cache: "no-store" });
    const data = await res.json();
    if (!data.values || data.values.length < 2) return [];
    const headers = data.values[0];
    return data.values.slice(1).map(row => {
      const obj = {};
      headers.forEach((h, i) => { obj[h.trim()] = (row[i] || "").trim(); });
      return obj;
    });
  }

  function roundTemp(val) {
    const num = parseFloat(val);
    return isNaN(num) ? "-" : Math.round(num);
  }

  async function loadStock() {
    const rows = await fetchSheet("Stocks");
    if (!rows.length) return;
    const last = rows[rows.length - 1];

    const sym    = last["symbol"] || "-";
    const price  = last["currentPrice"] || "-";
    const change = last["percentChange"] || "-";
    const ts     = last["timestamp"] || "";

    document.getElementById("stock-symbol").textContent = sym;
    document.getElementById("stock-price").textContent  = price !== "-" ? `$${parseFloat(price).toFixed(2)}` : "-";

    const pct = parseFloat(change);
    const changeEl = document.getElementById("stock-change");
    const pctDisplay = isNaN(pct) ? change : (pct >= 0 ? "+" : "") + pct.toFixed(2) + "%";
    changeEl.textContent = pctDisplay;
    changeEl.className   = "stock-change " + (pct >= 0 ? "positive" : "negative");

    document.getElementById("stock-time").textContent = ts ? `As of ${ts}` : "";
  }

  async function loadWeather() {
    const rows = await fetchSheet("Weather");
    if (!rows.length) return;

    // Get last row per city
    const map = {};
    rows.forEach(row => {
      const city = row["City"] || "";
      if (city) map[city] = row;
    });

    const grid = document.getElementById("weather-grid");
    grid.innerHTML = "";

    Object.values(map).forEach(row => {
      const rawCity   = row["City"] || "Unknown";
      const city      = mapCityName(rawCity);
      const temp      = roundTemp(row["Temp"]);
      const condition = row["Conditions"] || "";
      const wind      = row["Wind Speed"] || "";

      const card = document.createElement("div");
      card.className = "weather-card";
      card.innerHTML = `
        <div class="city-name">${city}</div>
        <div class="temp">${temp}<span>&deg;F</span></div>
        <div class="condition">${condition}</div>
        ${wind ? `<div class="condition">Wind: ${wind}</div>` : ""}
      `;
      grid.appendChild(card);
    });
  }

  async function loadForecast() {
    const rows = await fetchSheet("Forecast");
    if (!rows.length) return;

    // Get last row per city
    const map = {};
    rows.forEach(row => {
      const city = row["City"] || "";
      if (city) map[city] = row;
    });

    const grid = document.getElementById("forecast-grid");
    grid.innerHTML = "";

    const days = ["Day1", "Day2", "Day3", "Day4", "Day5"];
    const dayLabels = ["D1", "D2", "D3", "D4", "D5"];

    Object.values(map).forEach(row => {
      const rawCity = row["City"] || "Unknown";
      const city    = mapCityName(rawCity);

      let daysHtml = days.map((d, i) => {
        const high      = roundTemp(row[`${d} High`]);
        const low       = roundTemp(row[`${d} Low`]);
        const condition = row[`${d} Conditions`] || "";
        const precip    = row[`${d} Precip`] || "";
        const rainHtml  = precip ? `<span class="day-rain">${precip}</span>` : "";
        return `
          <div class="forecast-day">
            <span class="day-label">${dayLabels[i]}</span>
            <span class="day-condition">${condition}</span>
            <span class="day-temps">${high}&deg; / ${low}&deg;</span>
            ${rainHtml}
          </div>`;
      }).join("");

      const card = document.createElement("div");
      card.className = "forecast-card";
      card.innerHTML = `<div class="city-name">${city}</div>${daysHtml}`;
      grid.appendChild(card);
    });
  }

  async function refresh() {
    document.getElementById("last-updated").textContent = "Updating...";
    await Promise.all([loadStock(), loadWeather(), loadForecast()]);
    document.getElementById("last-updated").textContent = "Last updated: " + new Date().toLocaleTimeString();
  }

  refresh();
  setInterval(refresh, 5 * 60 * 1000);
</script>
</body>
</html>
