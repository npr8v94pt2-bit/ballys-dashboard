<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bally's Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #fff; font-family: Arial, sans-serif; padding: 20px; }
    .header { display: flex; align-items: center; justify-content: center; margin-bottom: 20px; gap: 20px; }
    .header img { height: 60px; }
    .header h1 { font-size: 2em; color: #cc0000; }
    .last-updated { text-align: center; font-size: 0.85em; color: #888; margin-bottom: 20px; }
    .section-title { font-size: 1.3em; color: #cc0000; border-bottom: 1px solid #cc0000; padding-bottom: 6px; margin-bottom: 14px; }
    .weather-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 30px; }
    .weather-card { background: #111; border: 1px solid #333; border-radius: 10px; padding: 16px; text-align: center; }
    .weather-card .city { font-size: 1.1em; font-weight: bold; color: #cc0000; margin-bottom: 6px; }
    .weather-card .temp { font-size: 2.2em; font-weight: bold; }
    .weather-card .condition { font-size: 0.9em; color: #aaa; margin-top: 4px; }
    .weather-card .wind { font-size: 0.85em; color: #888; margin-top: 4px; }
    .forecast-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin-bottom: 30px; }
    .forecast-card { background: #111; border: 1px solid #333; border-radius: 10px; padding: 16px; }
    .forecast-card .city { font-size: 1em; font-weight: bold; color: #cc0000; margin-bottom: 10px; }
    .forecast-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid #222; font-size: 0.85em; }
    .forecast-row:last-child { border-bottom: none; }
    .forecast-day { color: #aaa; width: 80px; }
    .forecast-temps { font-weight: bold; }
    .forecast-precip { color: #4af; }
    .stock-card { background: #111; border: 1px solid #333; border-radius: 10px; padding: 20px; display: inline-block; min-width: 220px; text-align: center; margin-bottom: 30px; }
    .stock-card .symbol { font-size: 1.4em; font-weight: bold; color: #cc0000; }
    .stock-card .price { font-size: 2.2em; font-weight: bold; margin-top: 6px; }
    .stock-card .change-pos { font-size: 1em; color: #0f0; margin-top: 4px; }
    .stock-card .change-neg { font-size: 1em; color: #f44; margin-top: 4px; }
  </style>
</head>
<body>

<div class="header">
  <img src="BALY.png" alt="Bally's Logo" />
  <h1>Bally's Live Dashboard</h1>
</div>
<div class="last-updated" id="lastUpdated">Loading...</div>

<div class="section-title">Current Weather</div>
<div class="weather-grid" id="weatherGrid">Loading...</div>

<div class="section-title">5-Day Forecast</div>
<div class="forecast-grid" id="forecastGrid">Loading...</div>

<div class="section-title">Stock</div>
<div id="stockSection"><div class="stock-card">Loading...</div></div>

<script>
const SHEET_ID = "1foje84iHozCcRp0uhcoVX2T__nhjUumNFNUFxBf55Qs";
const WEATHER_GID = "1766022830";
const FORECAST_GID = "653223377";
const STOCKS_GID = "1819125637";

const CITY_NAME_MAP = {
  "Zephyr Cove-Round Hill Village": "Stateline",
  "Central City": "Black Hawk"
};

function displayName(name) {
  return CITY_NAME_MAP[name] || name;
}

function sheetUrl(gid) {
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${gid}`;
}

async function fetchSheet(gid) {
  const res = await fetch(sheetUrl(gid), { cache: "no-store" });
  const text = await res.text();
  const json = JSON.parse(text.match(/google\.visualization\.Query\.setResponse\((.*?)\);/s)[1]);
  const cols = json.table.cols.map(c => c.label);
  const rows = json.table.rows.map(r => {
    const obj = {};
    r.c.forEach((cell, i) => { obj[cols[i]] = cell ? cell.v : null; });
    return obj;
  });
  return rows;
}

function getLastPerCity(rows, cityCol) {
  const map = {};
  rows.forEach(r => {
    if (r[cityCol]) map[r[cityCol]] = r;
  });
  return Object.values(map);
}

function getLastForecastPerCityDay(rows) {
  const map = {};
  rows.forEach(r => {
    const key = `${r.city}__${r.date || r.day}`;
    map[key] = r;
  });
  return Object.values(map);
}

async function loadWeather() {
  const rows = await fetchSheet(WEATHER_GID);
  const latest = getLastPerCity(rows, "city");
  const grid = document.getElementById("weatherGrid");
  grid.innerHTML = "";
  latest.forEach(r => {
    const card = document.createElement("div");
    card.className = "weather-card";
    const temp = r.temperature !== null ? Math.round(r.temperature) + "°F" : "-";
    const cond = r.condition || r.description || "-";
    const wind = r.windSpeed !== null && r.windSpeed !== undefined ? r.windSpeed + " mph" : (r.wind_speed !== null && r.wind_speed !== undefined ? r.wind_speed + " mph" : "-");
    card.innerHTML = `
      <div class="city">${displayName(r.city)}</div>
      <div class="temp">${temp}</div>
      <div class="condition">${cond}</div>
      <div class="wind">Wind: ${wind}</div>
    `;
    grid.appendChild(card);
  });
  const timestamps = latest.map(r => r.timestamp).filter(Boolean);
  if (timestamps.length) {
    document.getElementById("lastUpdated").textContent = "Last updated: " + new Date(timestamps[timestamps.length - 1]).toLocaleString();
  }
}

async function loadForecast() {
  const rows = await fetchSheet(FORECAST_GID);
  const latest = getLastForecastPerCityDay(rows);
  const cityMap = {};
  latest.forEach(r => {
    const name = r.city || r.City;
    if (!cityMap[name]) cityMap[name] = [];
    cityMap[name].push(r);
  });
  const grid = document.getElementById("forecastGrid");
  grid.innerHTML = "";
  Object.entries(cityMap).forEach(([city, days]) => {
    const card = document.createElement("div");
    card.className = "forecast-card";
    let rows_html = days.map(d => {
      const day = d.date || d.day || d.Date || "-";
      const high = d.highTemp !== null && d.highTemp !== undefined ? Math.round(d.highTemp) + "°" : (d.high !== null && d.high !== undefined ? Math.round(d.high) + "°" : "-");
      const low = d.lowTemp !== null && d.lowTemp !== undefined ? Math.round(d.lowTemp) + "°" : (d.low !== null && d.low !== undefined ? Math.round(d.low) + "°" : "-");
      const precip = d.precipitationChance !== null && d.precipitationChance !== undefined ? (d.precipitationChance * 100).toFixed(0) + "%" : (d.precip !== null && d.precip !== undefined ? d.precip + "%" : "-");
      return `<div class="forecast-row"><span class="forecast-day">${day}</span><span class="forecast-temps">${high} / ${low}</span><span class="forecast-precip">Rain: ${precip}</span></div>`;
    }).join("");
    card.innerHTML = `<div class="city">${displayName(city)}</div>${rows_html}`;
    grid.appendChild(card);
  });
}

async function loadStocks() {
  const rows = await fetchSheet(STOCKS_GID);
  const section = document.getElementById("stockSection");
  section.innerHTML = "";
  if (!rows.length) { section.innerHTML = "<p>No stock data</p>"; return; }
  const last = rows[rows.length - 1];
  const symbol = last.symbol || last.Symbol || "BALY";
  const price = last.currentPrice || last.price || last.Price;
  const change = last.percentChange || last.change || last.Change;
  const changeNum = parseFloat((change || "").toString().replace("%", ""));
  const changeClass = changeNum >= 0 ? "change-pos" : "change-neg";
  const changeSign = changeNum >= 0 ? "+" : "";
  const card = document.createElement("div");
  card.className = "stock-card";
  card.innerHTML = `
    <div class="symbol">${symbol}</div>
    <div class="price">${price}</div>
    <div class="${changeClass}">${changeSign}${change}</div>
  `;
  section.appendChild(card);
}

async function loadAll() {
  await Promise.all([loadWeather(), loadForecast(), loadStocks()]);
}

loadAll();
setInterval(loadAll, 5 * 60 * 1000);
</script>
</body>
</html>
