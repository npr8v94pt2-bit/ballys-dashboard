
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bally's Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    header {
      display: flex;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 2px solid #cc0000;
      padding-bottom: 12px;
    }
    header img {
      height: 60px;
      margin-right: 20px;
    }
    header h1 {
      font-size: 2rem;
      color: #cc0000;
      letter-spacing: 2px;
    }
    .last-updated {
      margin-left: auto;
      font-size: 0.8rem;
      color: #888;
    }
    .section-title {
      font-size: 1.2rem;
      color: #cc0000;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 12px;
      border-left: 4px solid #cc0000;
      padding-left: 10px;
    }
    /* STOCK */
    .stock-bar {
      background: #111;
      border: 1px solid #cc0000;
      border-radius: 8px;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 30px;
      margin-bottom: 28px;
    }
    .stock-symbol { font-size: 1.8rem; font-weight: bold; color: #fff; }
    .stock-price { font-size: 2rem; font-weight: bold; color: #fff; }
    .stock-change { font-size: 1.4rem; font-weight: bold; }
    .stock-change.positive { color: #00cc44; }
    .stock-change.negative { color: #cc0000; }
    .stock-time { color: #888; font-size: 0.8rem; margin-left: auto; }
    /* WEATHER GRID */
    .weather-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }
    .weather-card {
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 16px;
    }
    .weather-card h3 {
      font-size: 1rem;
      color: #cc0000;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .weather-main {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    .weather-temp {
      font-size: 2.5rem;
      font-weight: bold;
    }
    .weather-desc { color: #aaa; font-size: 0.9rem; text-transform: capitalize; }
    .weather-details { font-size: 0.8rem; color: #888; margin-top: 4px; }
    /* FORECAST */
    .forecast-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .forecast-card {
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 16px;
    }
    .forecast-card h3 {
      font-size: 1rem;
      color: #cc0000;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .forecast-day {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
      border-bottom: 1px solid #222;
      font-size: 0.85rem;
    }
    .forecast-day:last-child { border-bottom: none; }
    .forecast-day-name { color: #aaa; width: 80px; }
    .forecast-desc { color: #888; flex: 1; text-align: center; text-transform: capitalize; font-size: 0.75rem; }
    .forecast-temps { color: #fff; white-space: nowrap; }
    .forecast-high { color: #fff; }
    .forecast-low { color: #888; }
    .forecast-precip { color: #4af; font-size: 0.75rem; width: 40px; text-align: right; }
    .loading { color: #888; font-style: italic; }
    .error { color: #cc0000; }
  </style>
</head>
<body>

<header>
  <img src="BALY.png" alt="Bally's Logo" />
  <h1>BALLY'S LIVE DASHBOARD</h1>
  <div class="last-updated" id="lastUpdated">Loading...</div>
</header>

<!-- STOCK -->
<div class="section-title">Stock</div>
<div class="stock-bar" id="stockBar">
  <span class="loading">Loading stock data...</span>
</div>

<!-- CURRENT WEATHER -->
<div class="section-title">Current Weather</div>
<div class="weather-grid" id="weatherGrid">
  <span class="loading">Loading weather data...</span>
</div>

<!-- 5-DAY FORECAST -->
<div class="section-title">5-Day Forecast</div>
<div class="forecast-grid" id="forecastGrid">
  <span class="loading">Loading forecast data...</span>
</div>

<script>
  const SHEET_ID = "1foje84iHozCcRp0uhcoVX2T__nhjUumNFNUFxBf55Qs";
  const WEATHER_GID = "1766022830";
  const FORECAST_GID = "653223377";
  const STOCKS_GID = "1819125637";

  const CITY_NAME_MAP = {
    "Kingsbury": "Stateline"
  };

  function fixCityName(name) {
    if (!name) return name;
    return CITY_NAME_MAP[name] || name;
  }

  function sheetURL(gid) {
    return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${gid}&t=${Date.now()}`;
  }

  async function fetchSheet(gid) {
    const url = sheetURL(gid);
    const res = await fetch(url, { cache: "no-store" });
    const text = await res.text();
    const json = JSON.parse(text.match(/google\.visualization\.Query\.setResponse\((.+)\);?$/s)[1]);
    const cols = json.table.cols.map(c => c.label);
    const rows = json.table.rows;
    return rows.map(r => {
      const obj = {};
      cols.forEach((col, i) => {
        obj[col] = r.c[i] ? (r.c[i].f || r.c[i].v) : null;
      });
      return obj;
    });
  }

  // Get latest row per city (last occurrence)
  function getLatestPerCity(rows, cityCol) {
    const map = {};
    rows.forEach(row => {
      const city = row[cityCol];
      if (city) map[city] = row; // overwrites, so last row wins
    });
    return Object.values(map);
  }

  // Get latest forecast rows per city per day (last occurrence)
  function getLatestForecast(rows) {
    const map = {}; // key: city+date
    rows.forEach(row => {
      const city = row["city"] || row["City"] || row["location"] || row["Location"] || "";
      const date = row["date"] || row["Date"] || row["forecastDate"] || "";
      const key = city + "||" + date;
      if (city) map[key] = row;
    });
    return Object.values(map);
  }

  function renderStock(rows) {
    // Get the last row
    const row = rows[rows.length - 1];
    const bar = document.getElementById("stockBar");
    if (!row) { bar.innerHTML = '<span class="error">No stock data</span>'; return; }

    const symbol = row["symbol"] || row["Symbol"] || "BALY";
    const price = row["currentPrice"] || row["price"] || row["Price"] || "N/A";
    const change = row["percentChange"] || row["change"] || row["Change"] || "N/A";
    const timestamp = row["timestamp"] || row["Timestamp"] || "";

    const changeNum = parseFloat(String(change).replace("%", ""));
    const changeClass = changeNum >= 0 ? "positive" : "negative";
    const changeSign = changeNum >= 0 ? "+" : "";

    bar.innerHTML = `
      <span class="stock-symbol">${symbol}</span>
      <span class="stock-price">${price}</span>
      <span class="stock-change ${changeClass}">${changeSign}${change}</span>
      <span class="stock-time">As of ${timestamp}</span>
    `;
  }

  function renderWeather(rows) {
    const grid = document.getElementById("weatherGrid");

    // Detect city column
    const cityCol = rows.length > 0 ? (Object.keys(rows[0]).find(k => k.toLowerCase() === "city" || k.toLowerCase() === "location") || "city") : "city";

    const latest = getLatestPerCity(rows, cityCol);

    if (!latest.length) { grid.innerHTML = '<span class="error">No weather data</span>'; return; }

    grid.innerHTML = latest.map(row => {
      const city = fixCityName(row[cityCol] || row["City"] || row["location"] || row["Location"] || "Unknown");
      const temp = row["temperature"] || row["temp"] || row["Temperature"] || row["Temp"] || "N/A";
      const desc = row["description"] || row["conditions"] || row["Description"] || row["Conditions"] || "";
      const humidity = row["humidity"] || row["Humidity"] || "";
      const wind = row["windSpeed"] || row["wind"] || row["Wind"] || row["WindSpeed"] || "";
      const feels = row["feelsLike"] || row["feels_like"] || row["FeelsLike"] || "";

      return `
        <div class="weather-card">
          <h3>${city}</h3>
          <div class="weather-main">
            <div class="weather-temp">${temp}</div>
            <div>
              <div class="weather-desc">${desc}</div>
              ${feels ? `<div class="weather-details">Feels like ${feels}</div>` : ""}
            </div>
          </div>
          <div class="weather-details">
            ${humidity ? `Humidity: ${humidity}` : ""}
            ${wind ? ` &bull; Wind: ${wind}` : ""}
          </div>
        </div>
      `;
    }).join("");
  }

  function renderForecast(rows) {
    const grid = document.getElementById("forecastGrid");

    const cityCol = rows.length > 0 ? (Object.keys(rows[0]).find(k => k.toLowerCase() === "city" || k.toLowerCase() === "location") || "city") : "city";
    const dateCol = rows.length > 0 ? (Object.keys(rows[0]).find(k => k.toLowerCase() === "date" || k.toLowerCase() === "forecastdate") || "date") : "date";

    // Get latest forecast rows
    const latest = getLatestForecast(rows);

    // Group by city
    const cities = {};
    latest.forEach(row => {
      const city = fixCityName(row[cityCol] || "Unknown");
      if (!cities[city]) cities[city] = [];
      cities[city].push(row);
    });

    if (!Object.keys(cities).length) { grid.innerHTML = '<span class="error">No forecast data</span>'; return; }

    grid.innerHTML = Object.entries(cities).map(([city, days]) => {
      // Sort by date
      days.sort((a, b) => {
        const da = new Date(a[dateCol] || "");
        const db = new Date(b[dateCol] || "");
        return da - db;
      });

      const dayRows = days.slice(0, 5).map(day => {
        const dateStr = day[dateCol] || "";
        const dateObj = new Date(dateStr);
        const dayName = isNaN(dateObj) ? dateStr : dateObj.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
        const high = day["highTemp"] || day["high"] || day["High"] || day["maxTemp"] || "";
        const low = day["lowTemp"] || day["low"] || day["Low"] || day["minTemp"] || "";
        const desc = day["description"] || day["conditions"] || day["Description"] || day["Conditions"] || "";
        const precip = day["precipChance"] || day["precipitation"] || day["Precipitation"] || day["pop"] || "";

        return `
          <div class="forecast-day">
            <span class="forecast-day-name">${dayName}</span>
            <span class="forecast-desc">${desc}</span>
            <span class="forecast-temps">
              <span class="forecast-high">${high}</span>
              <span class="forecast-low"> / ${low}</span>
            </span>
            <span class="forecast-precip">${precip ? precip : ""}</span>
          </div>
        `;
      }).join("");

      return `
        <div class="forecast-card">
          <h3>${city}</h3>
          ${dayRows}
        </div>
      `;
    }).join("");
  }

  async function loadAll() {
    try {
      document.getElementById("lastUpdated").textContent = "Updating...";

      const [weatherRows, forecastRows, stockRows] = await Promise.all([
        fetchSheet(WEATHER_GID),
        fetchSheet(FORECAST_GID),
        fetchSheet(STOCKS_GID)
      ]);

      renderStock(stockRows);
      renderWeather(weatherRows);
      renderForecast(forecastRows);

      const now = new Date();
      document.getElementById("lastUpdated").textContent = "Last updated: " + now.toLocaleTimeString();
    } catch (err) {
      console.error("Dashboard error:", err);
      document.getElementById("lastUpdated").textContent = "Error loading data";
    }
  }

  loadAll();
  setInterval(loadAll, 5 * 60 * 1000);
</script>

</body>
</html>
