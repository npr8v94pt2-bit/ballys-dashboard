
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bally's Tahoe DOR Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #000000;
      color: #eee;
      padding: 20px;
    }

    /* MAIN LAYOUT */
    .dashboard {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 16px;
    }

    /* LEFT COLUMN */
    .left-col {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .logo-box {
      background: #111;
      border: 2px solid #cc0000;
      border-radius: 16px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-box img {
      width: 100%;
      max-width: 180px;
    }

    .stock-box {
      background: #111;
      border: 2px solid #cc0000;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }
    .stock-box .symbol { font-size: 1.2em; font-weight: bold; color: #cc0000; margin-bottom: 8px; }
    .stock-box .price { font-size: 2.2em; font-weight: bold; color: #fff; }
    .stock-box .change { font-size: 1.1em; font-weight: bold; margin-top: 6px; }
